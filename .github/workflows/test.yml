name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Primary path: flake-based config, Nix installed via cachix/install-nix-action.
  flake:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install nix-darwin (flake)
        uses: ./
        with:
          flake: ./examples/flake#cachix
      - name: Verify activation
        run: |
          . /etc/bashrc || true
          hello

  # Same as above, but with Nix installed via the Determinate installer instead,
  # to check the action isn't tied to one Nix installer. Uses a separate
  # darwinConfiguration without the Linux builder: Determinate's own daemon
  # conflicts with nix-darwin managing the Nix install, which nix.linux-builder
  # requires (see examples/flake/configuration-determinate.nix).
  flake-determinate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Install nix-darwin (flake)
        uses: ./
        with:
          flake: ./examples/flake#determinate
      - name: Verify activation
        run: |
          . /etc/bashrc || true
          hello

  # No 'flake' or 'config-file' given, falls back to the action's bundled
  # default configuration (modules/default.nix).
  default-config:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install nix-darwin (zero-config default)
        id: activate
        uses: ./
      - name: Verify activation
        run: |
          test -n "${{ steps.activate.outputs.system }}"
          readlink /run/current-system

  # Channel-based config via configuration.nix.
  channel:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install nix-darwin (channel config-file)
        uses: ./
        with:
          config-file: ./examples/channel/configuration.nix
      - name: Verify activation
        run: |
          . /etc/bashrc || true
          hello

  # Lint the shell entrypoint on every change.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/activate.sh
